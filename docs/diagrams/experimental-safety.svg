<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Experimental evidence ladder and safety gates</title><desc id="desc">The diagram distinguishes implemented code and local authored tests from consented field evidence and production readiness, with required safety gates between each level.</desc>
  <defs><style>
    .bg{fill:#f6f6f8}.panel{fill:#fff;stroke:#dedee4;stroke-width:1.5}.soft{fill:#ececf7;stroke:#c9cae8}.future{fill:#f0f0f3;stroke:#cfcfd5;stroke-width:1.5;stroke-dasharray:6 5}.ink{fill:#252529}.muted{fill:#74747d}.accent{fill:#6e75bf}.green{fill:#39785a}.amber{fill:#946e2d}.red{fill:#a74444}.bar{fill:#d6d6dc}.gate{fill:none;stroke:#a74444;stroke-width:2}text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.h1{font-size:29px;font-weight:700;letter-spacing:-.5px}.h2{font-size:15px;font-weight:700}.body{font-size:12px}.small{font-size:10.5px}.eye{font-size:11px;font-weight:700;letter-spacing:1.2px}.mono{font-family:ui-monospace,Menlo,monospace;font-size:10.5px}
  </style></defs>
  <rect class="bg" width="1200" height="650" rx="18"/><text class="eye red" x="50" y="44">EXPERIMENTAL RESEARCH SOFTWARE</text><text class="h1 ink" x="50" y="79">Be precise about what the evidence proves</text><text class="body muted" x="50" y="105">A passing local gate is useful engineering evidence. It is not a shortcut to consent, causal validity, or production safety.</text>

  <rect class="panel" x="52" y="151" width="242" height="154" rx="13"/><text class="eye green" x="76" y="181">LEVEL 1 · OBSERVED</text><text class="h2 ink" x="76" y="211">Executable code path</text><text class="small muted" x="76" y="235">store · MCP · console</text><text class="small muted" x="76" y="254">training command · rollback</text><rect x="76" y="273" width="154" height="8" rx="4" fill="#e8f3ed"/><rect x="76" y="273" width="154" height="8" rx="4" fill="#39785a"/>
  <rect class="soft" x="324" y="151" width="242" height="154" rx="13"/><text class="eye accent" x="348" y="181">LEVEL 2 · OBSERVED</text><text class="h2 ink" x="348" y="211">Authored local gate</text><text class="small muted" x="348" y="235">small controlled trajectories</text><text class="small muted" x="348" y="254">repeatable engineering receipt</text><rect x="348" y="273" width="154" height="8" rx="4" fill="#d8d9ed"/><rect x="348" y="273" width="119" height="8" rx="4" fill="#6e75bf"/>
  <rect class="future" x="596" y="151" width="242" height="154" rx="13"/><text class="eye amber" x="620" y="181">LEVEL 3 · NEEDED</text><text class="h2 ink" x="620" y="211">Consented field evidence</text><text class="small muted" x="620" y="235">real downstream outcomes</text><text class="small muted" x="620" y="254">governed temporal holdout</text><rect x="620" y="273" width="154" height="8" rx="4" fill="#d6d6dc"/><rect x="620" y="273" width="42" height="8" rx="4" fill="#946e2d"/>
  <rect class="future" x="868" y="151" width="282" height="154" rx="13"/><text class="eye red" x="892" y="181">LEVEL 4 · NOT CLAIMED</text><text class="h2 ink" x="892" y="211">Production readiness</text><text class="small muted" x="892" y="235">access control · encryption · SLOs</text><text class="small muted" x="892" y="254">incident response · compliance</text><rect x="892" y="273" width="194" height="8" rx="4" fill="#d6d6dc"/>

  <line class="gate" x1="294" y1="178" x2="324" y2="178"/><line class="gate" x1="566" y1="178" x2="596" y2="178"/><line class="gate" x1="838" y1="178" x2="868" y2="178"/>
  <text class="mono red" x="257" y="334">DO NOT SKIP LEVELS</text>

  <rect class="panel" x="52" y="373" width="1098" height="205" rx="14"/><text class="eye accent" x="78" y="405">NON-NEGOTIABLE GATES</text>
  <circle cx="90" cy="440" r="12" fill="#ececf7"/><text class="small accent" x="86" y="444">1</text><text class="body ink" x="116" y="444">No gradient updates after each conversation</text><text class="small muted" x="492" y="444">periodic candidates only</text>
  <circle cx="90" cy="477" r="12" fill="#ececf7"/><text class="small accent" x="86" y="481">2</text><text class="body ink" x="116" y="481">No raw private history in training by default</text><text class="small muted" x="492" y="481">feature-only, default-deny export</text>
  <circle cx="90" cy="514" r="12" fill="#ececf7"/><text class="small accent" x="86" y="518">3</text><text class="body ink" x="116" y="518">No automatic activation after training</text><text class="small muted" x="492" y="518">evaluate, review, promote, preserve rollback</text>
  <circle cx="650" cy="440" r="12" fill="#ececf7"/><text class="small accent" x="646" y="444">4</text><text class="body ink" x="676" y="444">Recalled text stays untrusted</text><text class="small muted" x="932" y="444">filtering reduces risk; it does not confer trust</text>
  <circle cx="650" cy="477" r="12" fill="#ececf7"/><text class="small accent" x="646" y="481">5</text><text class="body ink" x="676" y="481">Credit is heuristic evidence</text><text class="small muted" x="932" y="481">never report it as causal proof</text>
  <circle cx="650" cy="514" r="12" fill="#ececf7"/><text class="small accent" x="646" y="518">6</text><text class="body ink" x="676" y="518">Raw SQLite remains sensitive</text><text class="small muted" x="932" y="518">pseudonyms are not anonymity</text>
  <text class="body red" x="78" y="555">Use this repository for controlled experiments and research iteration, not unsupervised production memory.</text>
  <rect class="soft" x="52" y="601" width="1098" height="32" rx="9"/><text class="mono accent" x="77" y="622">IMPLEMENTED  →  LOCALLY TESTED  →  FIELD VALIDATED  →  PRODUCTION GOVERNED</text>
</svg>
