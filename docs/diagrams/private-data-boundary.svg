<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Repository and private data boundary</title><desc id="desc">Shareable source code and aggregate reports stay in Git while raw histories, databases, datasets, model caches, and adapters stay on a private SSD.</desc>
  <defs><style>
    .bg{fill:#f6f6f8}.panel{fill:#fff;stroke:#dedee4;stroke-width:1.5}.soft{fill:#ececf7;stroke:#c9cae8}.private{fill:#202025;stroke:#37373f;stroke-width:1.5}.ink{fill:#252529}.light{fill:#f2f2f5}.muted{fill:#74747d}.mutedDark{fill:#aaaab4}.accent{fill:#6e75bf}.green{fill:#39785a}.red{fill:#a74444}.line{fill:none;stroke:#6e75bf;stroke-width:2.2;marker-end:url(#a)}.blocked{fill:none;stroke:#a74444;stroke-width:2;stroke-dasharray:5 5}text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.h1{font-size:29px;font-weight:700;letter-spacing:-.5px}.h2{font-size:16px;font-weight:700}.body{font-size:12.5px}.small{font-size:11px}.eye{font-size:11px;font-weight:700;letter-spacing:1.2px}.mono{font-family:ui-monospace,Menlo,monospace;font-size:10.5px}
  </style><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0v6l8-3z" fill="#6e75bf"/></marker></defs>
  <rect class="bg" width="1200" height="640" rx="18"/><text class="eye accent" x="50" y="44">LOCAL-FIRST DATA PLACEMENT</text><text class="h1 ink" x="50" y="79">Share the code, isolate the sensitive artifacts</text><text class="body muted" x="50" y="105">Machine-specific paths stay in environment variables. Private training data never needs to enter the Git checkout.</text>

  <rect class="panel" x="48" y="148" width="450" height="395" rx="15"/><text class="eye accent" x="76" y="182">GIT REPOSITORY · SHAREABLE</text><text class="h2 ink" x="76" y="214">Reviewed source and aggregate evidence</text>
  <rect fill="#f0f0f3" x="76" y="240" width="394" height="48" rx="9"/><text class="mono ink" x="96" y="269">src/ · tests/ · scripts/ · docs/</text>
  <rect fill="#f0f0f3" x="76" y="302" width="394" height="48" rx="9"/><text class="mono ink" x="96" y="331">schemas · manifests · config templates</text>
  <rect fill="#f0f0f3" x="76" y="364" width="394" height="48" rx="9"/><text class="mono ink" x="96" y="393">aggregate evaluation reports</text>
  <text class="small green" x="76" y="448">Safe after review and redaction</text><text class="small muted" x="76" y="472">No raw conversations · no runtime DB</text><text class="small muted" x="76" y="493">no adapter trained on private history</text>

  <rect class="private" x="702" y="148" width="450" height="395" rx="15"/><text class="eye accent" x="730" y="182">PRIVATE SSD · ACCESS CONTROLLED</text><text class="h2 light" x="730" y="214">Raw and machine-local artifacts</text>
  <rect fill="#2b2b31" x="730" y="240" width="394" height="48" rx="9"/><text class="mono light" x="750" y="269">private/history-staging.db</text>
  <rect fill="#2b2b31" x="730" y="302" width="394" height="48" rx="9"/><text class="mono light" x="750" y="331">runtime/ · datasets/ · adapters/</text>
  <rect fill="#2b2b31" x="730" y="364" width="394" height="48" rx="9"/><text class="mono light" x="750" y="393">cache/huggingface/ · private reports</text>
  <text class="small" fill="#77b493" x="730" y="448">Restrict permissions · encrypt for production</text><text class="small mutedDark" x="730" y="472">Raw SQLite remains sensitive</text><text class="small mutedDark" x="730" y="493">Pseudonymous hashes are not anonymity</text>

  <path class="line" d="M508 242 C585 205 624 205 692 242"/><text class="small accent" x="551" y="207">reviewed templates</text>
  <path class="line" d="M692 417 C621 457 581 457 508 417"/><text class="small accent" x="544" y="478">aggregate metrics only</text>
  <line class="blocked" x1="540" y1="305" x2="660" y2="305"/><circle cx="600" cy="305" r="19" fill="#f8e8e8" stroke="#a74444"/><path d="M591 296l18 18m0-18-18 18" stroke="#a74444" stroke-width="2"/><text class="small red" x="534" y="342">raw content does not cross</text>

  <rect class="soft" x="48" y="570" width="1104" height="42" rx="10"/><text class="mono accent" x="72" y="596">MPM_SSD_ROOT=/Volumes/YourSSD/continual-memory-policy-model  ·  chmod 700 private/</text>
</svg>
