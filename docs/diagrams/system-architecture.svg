<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Continual Memory Policy Model architecture</title>
  <desc id="desc">Three time scales show immediate memory operations, delayed feedback from later agent work, and periodic gated adapter training.</desc>
  <defs>
    <style>
      .bg{fill:#f6f6f8}.panel{fill:#fff;stroke:#dedee4;stroke-width:1.5}.soft{fill:#ececf7}.ink{fill:#252529}.muted{fill:#6f6f78}.accent{fill:#6e75bf}.green{fill:#39785a}.amber{fill:#946e2d}.red{fill:#a74444}.line{fill:none;stroke:#b8b8c3;stroke-width:2}.flow{fill:none;stroke:#6e75bf;stroke-width:2.4;marker-end:url(#arrow)}.dash{fill:none;stroke:#8d8d98;stroke-width:1.5;stroke-dasharray:6 6;marker-end:url(#arrowGray)}text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.h1{font-size:30px;font-weight:700;letter-spacing:-.6px}.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.4px}.h2{font-size:17px;font-weight:700}.body{font-size:13px}.small{font-size:11px}.mono{font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;font-size:11px}.pill{fill:#f0f0f3;stroke:#dedee4}.pillAccent{fill:#ececf7;stroke:#c9cae8}.pillGood{fill:#e8f3ed;stroke:#bfd9ca}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6e75bf"/></marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8d8d98"/></marker>
  </defs>
  <rect class="bg" width="1200" height="720" rx="18"/>
  <text class="eyebrow accent" x="54" y="48">HOW IT WORKS</text>
  <text class="h1 ink" x="54" y="84">Three time scales, one auditable loop</text>
  <text class="body muted" x="54" y="111">Memory changes immediately. Model weights change only after evaluation and human approval.</text>

  <rect class="panel" x="40" y="142" width="1120" height="150" rx="14"/>
  <rect class="soft" x="58" y="160" width="126" height="28" rx="14"/>
  <text class="eyebrow accent" x="75" y="179">1 · REAL TIME</text>
  <text class="small muted" x="58" y="211">Every interaction</text>
  <rect class="pill" x="58" y="226" width="138" height="42" rx="9"/><text class="body ink" x="88" y="252">Conversation</text>
  <path class="flow" d="M205 247 H270"/>
  <rect class="pillAccent" x="280" y="211" width="202" height="72" rx="10"/>
  <text class="h2 ink" x="304" y="239">Memory policy</text><text class="small muted" x="304" y="260">LFM2.5-VL or baseline</text>
  <path class="flow" d="M492 247 H546"/>
  <rect class="pill" x="556" y="211" width="215" height="72" rx="10"/>
  <text class="h2 ink" x="580" y="239">Trusted executor</text><text class="small muted" x="580" y="260">validates and applies one action</text>
  <path class="flow" d="M781 247 H832"/>
  <rect class="pillGood" x="842" y="201" width="288" height="82" rx="10"/>
  <text class="h2 ink" x="866" y="230">SQLite memory + event ledger</text>
  <text class="mono green" x="866" y="254">WRITE · UPDATE · DELETE</text><text class="mono green" x="866" y="270">LINK · COMPACT · NOOP</text>

  <rect class="panel" x="40" y="310" width="1120" height="150" rx="14"/>
  <rect class="soft" x="58" y="328" width="132" height="28" rx="14"/>
  <text class="eyebrow accent" x="75" y="347">2 · LATER USE</text>
  <rect class="pill" x="58" y="374" width="178" height="58" rx="10"/>
  <text class="h2 ink" x="82" y="400">Future task</text><text class="small muted" x="82" y="418">Codex or Claude Code</text>
  <path class="flow" d="M246 403 H310"/>
  <rect class="pillAccent" x="320" y="374" width="190" height="58" rx="10"/>
  <text class="h2 ink" x="345" y="400">Recall memory</text><text class="small muted" x="345" y="418">retrieval ID recorded</text>
  <path class="flow" d="M520 403 H584"/>
  <rect class="pill" x="594" y="374" width="190" height="58" rx="10"/>
  <text class="h2 ink" x="620" y="400">Task result</text><text class="small muted" x="620" y="418">success, failure, or unknown</text>
  <path class="flow" d="M794 403 H858"/>
  <rect class="pillGood" x="868" y="374" width="262" height="58" rx="10"/>
  <text class="h2 ink" x="893" y="400">Delayed credit</text><text class="small muted" x="893" y="418">bounded reward + confidence</text>

  <rect class="panel" x="40" y="478" width="1120" height="190" rx="14"/>
  <rect class="soft" x="58" y="496" width="168" height="28" rx="14"/>
  <text class="eyebrow accent" x="75" y="515">3 · PERIODIC LEARNING</text>
  <rect class="pill" x="58" y="545" width="170" height="72" rx="10"/>
  <text class="h2 ink" x="82" y="574">Trajectory buffer</text><text class="small muted" x="82" y="594">new + replay + difficult</text>
  <path class="flow" d="M238 581 H293"/>
  <rect class="pillAccent" x="303" y="545" width="170" height="72" rx="10"/>
  <text class="h2 ink" x="327" y="574">LoRA candidate</text><text class="small muted" x="327" y="594">SFT / preference update</text>
  <path class="flow" d="M483 581 H538"/>
  <rect class="pill" x="548" y="545" width="170" height="72" rx="10"/>
  <text class="h2 ink" x="572" y="574">Evaluation gate</text><text class="small muted" x="572" y="594">utility · F1 · harm · privacy</text>
  <path class="flow" d="M728 581 H783"/>
  <rect class="pill" x="793" y="545" width="145" height="72" rx="10"/>
  <text class="h2 ink" x="817" y="574">Human review</text><text class="small muted" x="817" y="594">approve or reject</text>
  <path class="flow" d="M948 581 H1003"/>
  <rect class="pillGood" x="1013" y="545" width="117" height="72" rx="10"/>
  <text class="h2 ink" x="1037" y="574">Activate</text><text class="small muted" x="1037" y="594">or rollback</text>
  <path class="dash" d="M1070 627 C1060 654 383 658 383 625"/>
  <text class="small muted" x="612" y="651">Rejected and historical examples return as replay; a training run never promotes itself.</text>
  <text class="eyebrow red" x="58" y="696">BOUNDARY</text><text class="body ink" x="140" y="696">No per-conversation gradient updates. No raw memory text in the policy prompt by default.</text>
</svg>
