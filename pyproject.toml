[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mpm"
version = "0.1.0"
description = "Memory Policy Model: a tiny policy model that learns WRITE/UPDATE/DELETE/LINK/COMPACT/NOOP decisions for an external memory system from delayed downstream consequences."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MPM Research" }]

[project.optional-dependencies]
train = [
    "torch>=2.2",
    "transformers>=5.0.0",
    "peft>=0.10",
    "accelerate>=0.29",
    "datasets>=2.18",
    "safetensors>=0.4",
    "pillow>=10.0",
]

[project.scripts]
mpm = "mpm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
